name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./photoalbum
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/photoalbum-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/photoalbum-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./photoalbum_frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.BACKEND_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/photoalbum-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/photoalbum-frontend:latest

  terraform:
    name: Terraform apply (Azure + OKD)
    runs-on: ubuntu-latest
    needs: build-and-push
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Cache Terraform state
        uses: actions/cache@v3
        with:
          path: infra/terraform/terraform.tfstate
          key: terraform-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: terraform-state-${{ github.ref_name }}-
          save-always: true

      - name: Configure kubectl for OKD
        run: |
          kubectl config set-cluster okd \
            --server="${{ secrets.OKD_HOST }}" \
            --insecure-skip-tls-verify=true
          kubectl config set-credentials github-actions \
            --token="${{ secrets.OKD_TOKEN }}"
          kubectl config set-context okd \
            --cluster=okd \
            --user=github-actions \
            --namespace="photoalbum-f041om"
          kubectl config use-context okd

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var="okd_host=${{ secrets.OKD_HOST }}" \
            -var="okd_token=${{ secrets.OKD_TOKEN }}" \
            -var="backend_image=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/photoalbum-backend:${{ github.sha }}" \
            -var="frontend_image=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/photoalbum-frontend:${{ github.sha }}" \
            -var="django_allowed_hosts=${{ vars.BACKEND_ALLOWED_HOSTS }}" \
            -var="django_secret_key=${{ secrets.DJANGO_SECRET_KEY }}" \
            -var="azure_account_key=${{ secrets.AZURE_ACCOUNT_KEY }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

